[package]
name = "tide-desk"
version = "0.1.0"
description = "潮汐 · 桌面工作任务管理"
authors = ["Air-XII"]
license = "MIT"
repository = "https://github.com/Air-XII/tide-desk"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tide_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
